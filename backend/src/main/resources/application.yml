server:
  port: 8080


spring:
  datasource:
    url: jdbc:postgresql://localhost:5332/customer
    username: loocos
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  main:
    web-application-type: servlet
  web:
    error:
      include-message: always