services:
  db:
    container_name: postgres
    image: postgres
    environment:
      POSTGRES_USER: loocos
      POSTGRES_PASSWORD: password
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - db
    restart: unless-stopped
  spring-boot-app:
    container_name: spring-boot-app
    image: calinalexandrucosmin89/spring-boot-app
    environment:
       SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/customer
    ports:
      - "8088:8080"
    networks:
      - db
    depends_on:
      - db
    restart: unless-stopped
  spring-boot-app-react:
    container_name: spring-boot-app-react
    image: calinalexandrucosmin89/spring-boot-app-react
    build:
      context: frontend/react
      args:
        api_base_url: http://localhost:8088
    ports:
      - "3000:5173"
    depends_on:
      - spring-boot-app
    restart: unless-stopped

networks:
  db:
    driver: bridge

volumes:
  db: